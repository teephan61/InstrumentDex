@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
.root{--bg:#e9eef1;--surface:#fff;--ink:#16242e;--soft:#5d6e78;--sterile:#15728e;--sterile-deep:#0e4f63;--line:#d3dde2;--ok:#2e7d5b;--pend:#b5791f;--old:#b23a3a;--decon:#b5791f;--assembly:#5d6e78;--steril:#15728e;--disp:'Space Grotesk','Segoe UI',sans-serif;--body:'Inter','Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--body);color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;}
.root *{box-sizing:border-box;}
.mono{font-family:var(--mono);}
.muted{color:var(--soft);font-size:13px;margin:0;}
.muted-inline{color:var(--soft);font-size:12px;}
.f-label{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);margin-bottom:4px;}

.header{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;gap:12px;flex-wrap:wrap;}
.wordmark{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
.mark,.mark-accent{color:var(--sterile);}
.header-right{display:flex;align-items:center;gap:14px;}
.header-sub{font-family:var(--mono);font-size:11px;color:var(--soft);}
.btn-add{font-family:var(--body);font-size:13px;font-weight:500;padding:8px 14px;border-radius:9px;border:none;background:var(--sterile-deep);color:#fff;cursor:pointer;}
.btn-add:hover{background:var(--sterile);}

.main{max-width:1060px;margin:0 auto;padding:22px;}
.searchwrap{max-width:680px;margin:8px auto 0;}
.search{display:flex;align-items:center;gap:11px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:0 15px;}
.search:focus-within{border-color:var(--sterile);box-shadow:0 0 0 4px rgba(21,114,142,.1);}
.search-ic{color:var(--soft);flex:none;}
.search input{flex:1;border:none;outline:none;background:none;font-family:var(--body);font-size:16px;padding:15px 0;color:var(--ink);}
.clear{border:none;background:#eef3f5;color:var(--soft);width:25px;height:25px;border-radius:50%;cursor:pointer;font-size:12px;}
.chips-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;justify-content:center;}
.chip-btn{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--soft);cursor:pointer;}
.chip-btn.on{background:var(--sterile-deep);border-color:var(--sterile-deep);color:#fff;}

.resulthead{display:flex;align-items:center;justify-content:space-between;max-width:1060px;margin:22px auto 14px;font-size:13px;color:var(--soft);}
.reset{border:none;background:none;color:var(--sterile);cursor:pointer;font-family:var(--mono);font-size:13px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:15px;}
.card{position:relative;text-align:left;cursor:pointer;padding:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;transition:transform .14s,box-shadow .14s,border-color .14s;font-family:var(--body);}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(16,36,46,.1);border-color:#bcccd3;}
.band{position:absolute;left:0;top:0;bottom:0;width:7px;z-index:2;background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.55) 5px 8px);}
.band-ok{background-color:var(--ok);}.band-pend{background-color:var(--pend);}.band-old{background-color:var(--old);}
.card-photo{position:relative;height:130px;background:linear-gradient(160deg,#f4f7f9,#e6edf0);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);overflow:hidden;}
.art{height:112px;width:auto;}
.art-img{max-height:128px;max-width:94%;object-fit:contain;}
.art-img.big{max-height:176px;max-width:100%;}
.photo-preview{border:1.5px dashed var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;min-height:90px;overflow:hidden;}
.photo-preview img{max-height:120px;max-width:100%;object-fit:contain;}
.photo-tag{position:absolute;right:8px;bottom:6px;font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#9fb0b8;}
.card-body{padding:12px 14px 14px;}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.id{font-size:11px;color:var(--soft);}
.card-body h3{font-family:var(--disp);font-weight:600;font-size:16px;line-height:1.18;margin:0 0 6px;}
.card-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.via{font-size:11.5px;color:var(--sterile);font-style:italic;margin:6px 0 0;}
.card-flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.flag{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:#eef3f5;color:var(--soft);}
.flag-danger{background:#f4e0e0;color:var(--old);}
.sp{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;}
.sp-crit{background:#e0eef2;color:var(--sterile-deep);}
.sp-semi{background:#f6ecd8;color:var(--pend);}
.sp-non{background:#eef3f5;color:var(--soft);}
.pill{font-family:var(--mono);font-size:9.5px;padding:3px 7px;border-radius:6px;white-space:nowrap;}
.pill-ok{background:#e4f1ea;color:var(--ok);}.pill-pend{background:#f6ecd8;color:var(--pend);}.pill-old{background:#f4e0e0;color:var(--old);}

.foot{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--soft);}
.legend-t{font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;font-size:10px;}
.legend{display:flex;align-items:center;gap:5px;}
.legend i{width:16px;height:9px;border-radius:2px;display:inline-block;background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.6) 4px 6px);}
.foot-note{margin-left:auto;font-style:italic;}

.overlay{position:fixed;inset:0;background:rgba(16,36,46,.45);backdrop-filter:blur(2px);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:36px 16px;overflow-y:auto;}
.sheet{position:relative;width:100%;max-width:720px;background:var(--surface);border-radius:18px;padding:26px;box-shadow:0 30px 80px rgba(16,36,46,.3);}
.close{position:absolute;right:15px;top:15px;width:31px;height:31px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--soft);cursor:pointer;}
.sheet-head{display:flex;gap:20px;margin-bottom:18px;}
.sheet-photo{position:relative;flex:none;width:160px;height:180px;background:linear-gradient(160deg,#f4f7f9,#e6edf0);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.sheet-photo .art{height:140px;}
.photo-cap{position:absolute;bottom:0;left:0;right:0;padding:5px 7px;font-family:var(--mono);font-size:8px;line-height:1.3;color:#7e9099;background:rgba(255,255,255,.78);text-align:center;}
.photo-cap em{font-style:italic;color:var(--sterile-deep);}
.sheet-title h2{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.1;margin:5px 0 8px;}
.head-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.aka{margin-top:12px;}
.aka-tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{font-size:11.5px;padding:3px 8px;background:#eef3f5;border-radius:6px;color:var(--sterile-deep);}

.warnbox{background:#fbf3e3;border:1px solid #ecd9ad;border-left:4px solid var(--pend);border-radius:10px;padding:12px 15px;margin-bottom:18px;}
.warn-h{display:block;font-family:var(--disp);font-weight:600;font-size:13.5px;color:#8a6516;margin-bottom:4px;}
.warnbox p{margin:0;font-size:13.5px;line-height:1.5;color:#5f4c22;}

.spine-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin-bottom:9px;}
.spine{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch;margin-bottom:20px;}
.stage{border:1px solid var(--line);border-radius:12px;padding:13px;border-top:3px solid var(--assembly);background:#fafcfd;}
.stage-decon{border-top-color:var(--decon);}.stage-assembly{border-top-color:var(--assembly);}.stage-steril{border-top-color:var(--steril);}
.stage-title{font-family:var(--disp);font-weight:600;font-size:13px;display:block;margin-bottom:10px;}
.stage-decon .stage-title{color:#8a6516;}.stage-steril .stage-title{color:var(--sterile-deep);}
.f{margin-bottom:10px;}
.f-val{font-size:13px;line-height:1.45;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.chip{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:5px;}
.chip-neutral{background:#eef3f5;color:var(--soft);}
.chip-danger{background:#f4e0e0;color:var(--old);font-weight:600;}
.arrow{display:flex;align-items:center;justify-content:center;color:#b8c6cd;font-size:20px;}

.meta{display:flex;flex-direction:column;gap:13px;}
.ifu{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ifu-btn{font-family:var(--body);font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;border:none;background:var(--sterile-deep);color:#fff;cursor:pointer;}
.ifu code{font-family:var(--mono);font-size:12px;color:var(--soft);}
.confuse{display:flex;flex-wrap:wrap;gap:7px;}
.link{font-family:var(--body);font-size:13px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--sterile-deep);cursor:pointer;}
.link:hover{border-color:var(--sterile);background:#f0f6f8;}
.review{font-family:var(--mono);font-size:12px;color:var(--soft);border-top:1px solid var(--line);padding-top:12px;}

.form{max-width:760px;margin:6px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;}
.form-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.form-head h2{font-family:var(--disp);font-weight:700;font-size:22px;margin:0;}
.req,.ff i{color:var(--old);font-style:normal;}
.form-sec{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:20px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line);}
.sec-decon{color:#8a6516;}.sec-steril{color:var(--sterile-deep);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ff{display:flex;flex-direction:column;gap:5px;}
.ff>span{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);}
.ff input,.ff select{font-family:var(--body);font-size:14px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);outline:none;}
.ff input:focus,.ff select:focus{border-color:var(--sterile);}
.ff input:disabled,.ff select:disabled{opacity:.5;cursor:not-allowed;background:#f1f5f7;}
.ff-off>span{opacity:.5;}
.ff-check{flex-direction:row;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;}
.ff-check input{width:18px;height:18px;}
.ff-spacer{display:block;}
.hint{font-size:11.5px;color:var(--soft);font-style:italic;margin:8px 0 0;}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
.btn-ghost{font-family:var(--body);font-size:14px;padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--soft);cursor:pointer;}
.btn-primary{font-family:var(--body);font-size:14px;font-weight:500;padding:10px 20px;border-radius:9px;border:none;background:var(--sterile-deep);color:#fff;cursor:pointer;}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}

@media (max-width:640px){
  .sheet-head{flex-direction:column;}.sheet-photo{width:100%;height:160px;}
  .spine{grid-template-columns:1fr;}.arrow{transform:rotate(90deg);}
  .grid2{grid-template-columns:1fr;}.ff-spacer{display:none;}.foot-note{margin-left:0;width:100%;}
}
